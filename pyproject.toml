[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vslocator"
dynamic = ["version"]
description = "Dependency-free Python reimplementation of vswhere for locating Visual Studio instances"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vslocator contributors" }]
keywords = ["visual-studio", "vswhere", "msbuild", "windows", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/zchrissirhcz/vslocator"
Repository = "https://github.com/zchrissirhcz/vslocator"
Issues = "https://github.com/zchrissirhcz/vslocator/issues"

[project.scripts]
vslocator = "vslocator:main"

[tool.setuptools]
py-modules = ["vslocator"]

[tool.setuptools.dynamic]
version = { attr = "vslocator.__version__" }
